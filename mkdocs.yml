# MutInt's manual. `./mutint docs` builds it, merging in every installed component's pages --
# see mutint_common/docs_manual.py for how that works.
#
# The nav below is only MutInt's own contribution. `Using MutInt` and `Extending MutInt` come
# from mutint-core and the plugins; this project files its pages under `About this deployment`,
# which is where a component's own story goes.

site_name: MutInt
site_description: The reference MutInt assembly
repo_url: https://github.com/mutint/mutint
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: null
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite

nav:
  - About this deployment:
      - What MutInt is: index.md
      - Installing it: installing.md
      - What is inside it: components.md
